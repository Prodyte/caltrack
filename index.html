<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haldi</title>
<meta name="description" content="A private calorie tracker that works offline.">
<meta name="theme-color" content="#DDE2DF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haldi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="gabarito.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: Gabarito; src: url(gabarito.woff2) format("woff2"); font-weight: 400 900; font-display: swap; }
:root {
  color-scheme: light dark;
  --haldi: #F2B100; --steel: #DDE2DF; --hero-ink: #18211E;
  --bg: #F5F7F6; --ink: #18211E; --muted: #55625D; --line: #D3D9D6; --field: #FFFFFF;
  --bar: #A87900; --over: #C4281C; --button: #18211E; --button-ink: #F5F7F6;
  --gut: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161C1A; --ink: #EDF1EF; --muted: #A3AFAA; --line: #2F3835; --field: #212926;
    --bar: #D49B00; --over: #F0614F; --button: #F2B100; --button-ink: #18211E; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.35 Gabarito, system-ui, sans-serif; font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--bar); outline-offset: 2px; }
[hidden] { display: none !important; }

/* The one loud thing: the day's budget is a level of haldi that falls as you eat. */
#hero { position: relative; isolation: isolate; color: var(--hero-ink); background: var(--steel); min-height: max(330px, 44svh);
  padding: calc(env(safe-area-inset-top) + 6px) var(--gut) 18px; display: flex; flex-direction: column; overflow: hidden; }
#level { position: absolute; inset: auto 0 0; z-index: -1; height: 100%; background: var(--haldi); transition: height .7s cubic-bezier(.3,.8,.3,1); }
#hero.over { background: #A81F15; color: #fff; }
#hero.over #level { height: 0 !important; }
#hero :focus-visible { outline-color: currentColor; }
.datebar { display: flex; align-items: center; gap: 2px; margin-inline: -10px; }
.datebar .icon { width: 44px; height: 44px; font-size: 26px; line-height: 1; }
.datebar .icon:disabled { opacity: .25; }
#dayname { font-size: 19px; font-weight: 700; flex: 0 1 auto; padding: 0 2px; }
#settings-open { margin-left: auto; min-height: 44px; padding: 0 10px; font-weight: 600; }
.figure { margin-top: auto; }
#left { font-size: clamp(92px, 31vw, 148px); font-weight: 800; line-height: .88; letter-spacing: -.035em; margin-left: -.03em; }
#leftlabel { font-size: 22px; font-weight: 700; margin-top: 8px; }
#of { display: block; min-height: 32px; font-size: 17px; text-align: left; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

main { max-width: 640px; margin: auto; padding: 0 var(--gut) calc(env(safe-area-inset-bottom) + 96px); }
#macros { display: flex; justify-content: space-between; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
#macros b { display: block; font-size: 21px; font-weight: 700; }
#macros span { color: var(--muted); font-size: 15px; }
.meal { padding-top: 16px; }
.mealhead { display: flex; align-items: center; gap: 10px; }
.mealhead h2 { font-size: 21px; font-weight: 700; margin: 0; }
.mealhead span { color: var(--muted); margin-left: auto; }
.mealhead button { width: 44px; height: 44px; margin-right: -10px; font-size: 26px; line-height: 1; }
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: flex; gap: 12px; width: 100%; min-height: 54px; padding: 8px 0; text-align: left; align-items: center; border-top: 1px solid var(--line); }
.row .text { flex: 1; min-width: 0; }
.row .name { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
.row small { display: block; color: var(--muted); font-size: 15px; }
.row .kcal { font-weight: 700; white-space: nowrap; }
.hint { color: var(--muted); padding: 14px 0; margin: 0; }

#week { margin-top: 30px; }
.weekhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 10px; }
.weekhead h2 { font-size: 21px; margin: 0; }
.weekhead span { color: var(--muted); font-size: 15px; text-align: right; }
.bars { position: relative; display: flex; align-items: flex-end; height: 150px; border-bottom: 1px solid var(--muted); }
.goal-line { position: absolute; inset-inline: 0; border-top: 1px solid var(--muted); }
.col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.col i { display: block; width: min(24px, 70%); background: var(--bar); border-radius: 4px 4px 0 0; min-height: 2px; }
.col.high i { background: var(--ink); }
.col.empty i { background: var(--line); }
.col em { font-style: normal; font-size: 13px; font-weight: 700; white-space: nowrap; margin-bottom: 2px; background: var(--bg); position: relative; }
.days { display: flex; }
.days span { flex: 1; text-align: center; font-size: 14px; padding-top: 4px; color: var(--muted); }
.days .now { color: var(--ink); font-weight: 700; }

#add { position: fixed; z-index: 2; left: var(--gut); right: var(--gut); bottom: calc(env(safe-area-inset-bottom) + 14px); max-width: 608px; margin: auto; height: 58px;
  background: var(--button); color: var(--button-ink); border-radius: 29px; font-size: 19px; font-weight: 700; }

dialog { position: fixed; inset: 0; width: 100%; max-width: 640px; height: 100%; max-height: none; margin: auto; border: 0; padding: calc(env(safe-area-inset-top) + 6px) var(--gut) calc(env(safe-area-inset-bottom) + 16px);
  background: var(--bg); color: var(--ink); overscroll-behavior: contain; }
dialog[open] { display: flex; flex-direction: column; }
dialog[open] > div { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.sheethead { display: flex; align-items: center; min-height: 48px; gap: 8px; }
.sheethead h2 { font-size: 21px; margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.link { min-height: 44px; padding: 0 2px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
input, select { width: 100%; height: 50px; padding: 0 14px; background: var(--field); border: 1px solid var(--muted); border-radius: 10px; font-size: 18px; }
.meals { display: flex; gap: 4px; margin: 10px 0; }
.meals button { flex: 1; min-height: 42px; border-radius: 8px; font-size: 15px; font-weight: 600; }
.meals button[aria-pressed=true] { background: var(--haldi); color: var(--hero-ink); }
.results { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin-inline: calc(var(--gut) * -1); padding-inline: var(--gut); }
.results h3 { font-size: 15px; font-weight: 600; color: var(--muted); margin: 8px 0; }
.portions { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 18px; }
.portions button { min-height: 44px; padding: 6px 14px; border: 1px solid var(--muted); border-radius: 22px; text-align: left; overflow-wrap: anywhere; }
.portions button[aria-pressed=true] { background: var(--haldi); color: var(--hero-ink); border-color: var(--haldi); font-weight: 600; }
.stepper { display: flex; gap: 8px; align-items: center; }
.stepper button { flex: none; width: 54px; height: 54px; border: 1px solid var(--muted); border-radius: 27px; font-size: 26px; line-height: 1; }
.stepper input { height: 54px; text-align: center; font-size: 22px; font-weight: 700; }
.result { margin: 24px 0 8px; }
.result b { font-size: 54px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.result p { margin: 6px 0 0; color: var(--muted); }
.primary { width: 100%; min-height: 56px; margin-top: auto; background: var(--button); color: var(--button-ink); border-radius: 28px; font-size: 19px; font-weight: 700; flex: none; }
.danger { color: var(--over); font-weight: 600; min-height: 48px; width: 100%; flex: none; }
label { display: block; font-weight: 600; margin: 14px 0 0; }
label input { margin-top: 5px; font-weight: 400; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.note { color: var(--muted); font-size: 15px; margin: 8px 0; }
.error { color: var(--over); font-weight: 600; min-height: 1.35em; margin: 8px 0; }
.stack { overflow-y: auto; flex: 1; display: flex; flex-direction: column; }
.stack section { padding: 14px 0; border-top: 1px solid var(--line); }
.stack h3 { margin: 0 0 4px; font-size: 18px; }
.outline { min-height: 48px; padding: 0 18px; margin: 6px 8px 0 0; border: 1px solid var(--muted); border-radius: 24px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { #level { transition: none; } }
</style>
</head>
<body>
<header id="hero">
  <div id="level"></div>
  <div class="datebar">
    <button class="icon" id="prev" aria-label="Previous day">‹</button>
    <span id="dayname" aria-live="polite"></span>
    <button class="icon" id="next" aria-label="Next day">›</button>
    <button id="settings-open">Settings</button>
  </div>
  <div class="figure">
    <div id="left"></div>
    <div id="leftlabel"></div>
    <button id="of"></button>
  </div>
</header>
<main>
  <div id="macros"></div>
  <div id="meals"></div>
  <section id="week"></section>
</main>
<button id="add">Add food</button>
<dialog id="sheet"><div id="sheetbody"></div></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
